# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main","dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libpq-dev libegl1 -y
    - name: Install project dependencies
      run: |
        uv sync --all-groups
        uv pip install keyrings.alt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uvx flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uvx flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Prepare keyring just for testing
      env:
        PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
      run: |
        uv run python - <<EOF
        import keyring
        from cryptography.fernet import Fernet

        key = Fernet.generate_key().decode()
        keyring.set_password("db_catcher", "credential_key", key)
        EOF

    - name: Test with pytest
      run: |
        uv run pytest --container-scope module
