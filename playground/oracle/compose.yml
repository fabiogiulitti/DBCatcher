services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle_container
    environment:
      ORACLE_PASSWORD: testpassword
      APP_USER: testuser
      APP_USER_PASSWORD: testpassword
    volumes:
      - ./init.sql:/container-entrypoint-initdb.d/init.sql
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
